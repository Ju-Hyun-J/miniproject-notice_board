services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: board_db
      MYSQL_USER: boarddb
      MYSQL_PASSWORD: 1234
      MYSQL_ROOT_PASSWORD: root1234
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot1234"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: board_db
      DB_USERNAME: boarddb
      DB_PASSWORD: 1234
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:


